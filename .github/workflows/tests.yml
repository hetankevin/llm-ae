name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[setup,dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: llm-ae --home "$RUNNER_TEMP/llm-ae-demo" --json demo

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ae"
version = "0.1.0"
description = "A local CLI assistant for associate editors"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
dev = ["ruff>=0.11"]

[project.scripts]
llm-ae = "llm_ae.cli:main"

[tool.setuptools.packages.find]
include = ["llm_ae*"]

[tool.ruff]
line-length = 100
target-version = "py311"

